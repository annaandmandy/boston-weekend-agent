name: Meet Boston ingestion

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ingestion dependencies
        run: pip install -r services/collect-events/requirements.txt boto3
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.MEET_BOSTON_INGEST_ROLE_ARN }}
          aws-region: us-east-1
      - name: Fetch and stage Meet Boston events
        run: >-
          python scripts/ingest_meet_boston.py
          --bucket boston-weekend-agent-reports
          --region us-east-1
